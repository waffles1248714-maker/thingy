name: Build Base Probability Scanner

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: base-probability-scanner-jar
          path: build/libs/*.jar
          if-no-files-found: error
